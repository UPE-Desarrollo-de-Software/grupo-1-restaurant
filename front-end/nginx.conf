# Template de nginx para la imagen de producción (ver front-end/Dockerfile).
# Sirve el build de Vite y reenvía a la API:
#   - /api/  la API de Laravel (incluye /api/broadcasting/auth).
#   - /app/  los websockets de Reverb (la API los deriva a Reverb dentro de su contenedor).
# HTTPS y el certificado los maneja Traefik (Dokploy) por delante: acá todo es HTTP interno.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Las imágenes de los platos pueden pesar hasta 2 MB.
  client_max_body_size 5m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # DNS interno de Docker, re-consultado cada 10 s: si el contenedor de la API se recrea
  # con otra IP en un redeploy, nginx la encuentra sin reiniciarse.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://${API_UPSTREAM};

  location /api/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  location /app/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Reverb manda un ping cada 30-60 s: el timeout tiene que ser mayor.
    proxy_read_timeout 120s;
  }

  # Los archivos de assets/ llevan un hash en el nombre: se cachean un año.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA: cualquier ruta que no sea un archivo devuelve index.html, que nunca se cachea
  # (así un deploy nuevo se ve al recargar).
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
